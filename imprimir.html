<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imprimir las cartas · Suena igual</title>
<link rel="stylesheet" href="fuentes/fuentes.css">
<style>
/* Las cartas de la partida elegida, para recortar: 9 por hoja A4 (63 × 88 mm, el tamaño de una carta
   de baraja). Se imprime desde el navegador. Las mismas reglas que el juego en pantalla. */
:root{--rojo:#E0473C;--azul:#2E7CD6;--verde:#2FA866;--amarillo:#F2C230;--tinta:#10231A}
*{box-sizing:border-box}
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--tinta);background:#eef2f6}
.barra{position:sticky;top:0;background:#123A5C;color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center}
.barra b{flex:1;min-width:200px;font-family:'Jost',system-ui,sans-serif;font-size:18px}
.barra button,.barra a{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 14px;margin:4px;background:#F4B93A;color:var(--tinta);text-decoration:none;cursor:pointer}
.barra a{background:#fff}
.instr{max-width:760px;margin:14px auto;padding:0 14px;font-size:16px;line-height:1.5}
.hoja{width:210mm;min-height:297mm;margin:10mm auto;background:#fff;padding:10mm 9mm;display:flex;flex-wrap:wrap;align-content:flex-start;box-shadow:0 4px 20px rgba(0,0,0,.15);page-break-after:always}
.c{width:63mm;height:88mm;margin:0 0 2mm 0;border:1px dashed #b8c2cc;display:flex;align-items:center;justify-content:center}
.c+.c{margin-left:0}
.cara{width:59mm;height:84mm;border-radius:4mm;border:3mm solid;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center;padding:4mm}
.cara .p{font-weight:700;font-size:9mm;line-height:1.05;word-break:break-word}
.cara .s{font-size:3.6mm;font-weight:700;margin-top:3mm;color:#4d6457}
.cara .e{font-family:'Jost',system-ui,sans-serif;font-weight:600;font-size:18mm;line-height:1}
.cara .esq{position:absolute;top:2mm;left:3mm;font-size:3.4mm;font-weight:700}
.cara .pie{position:absolute;bottom:2mm;left:0;right:0;font-size:2.6mm;color:#6b7b88}
.rojo{border-color:var(--rojo)}.azul{border-color:var(--azul)}.verde{border-color:var(--verde)}.amarillo{border-color:var(--amarillo)}
.negra{border-color:#222;background:conic-gradient(var(--rojo) 0 25%,var(--azul) 0 50%,var(--verde) 0 75%,var(--amarillo) 0)}
.negra .e,.negra .s{background:#fff;border-radius:3mm;padding:0 2mm}
.reglas .cara{border-color:#123A5C;font-size:3.6mm;line-height:1.35;text-align:left;justify-content:flex-start}
.reglas .cara b{font-family:'Jost',system-ui,sans-serif;font-size:5mm}
@media print{body{background:#fff}.barra,.instr{display:none}.hoja{margin:0;box-shadow:none;padding:6mm 9mm}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="barra"><b id="tit">Suena igual · cartas para imprimir</b><button type="button" onclick="window.print()">🖨️ Imprimir</button><a href="./" id="volver">← Volver al juego</a></div>
<p class="instr" id="instr"></p>
<div id="hojas"></div>
<script src="banco.js"></script>
<script src="fonetica.js"></script>
<script src="juego.js"></script>
<script>
(function () {
  var S = window.__suena, b = S.nuevaBaraja(), O = S.OPC;
  var palabras = b.cartas.filter(function (c) { return c.tipo === 'palabra'; }).sort(function (x, y) { return x.son < y.son ? -1 : (x.son > y.son ? 1 : 0); });
  var especiales = b.cartas.filter(function (c) { return c.tipo !== 'palabra'; });
  var todas = [{ reglas: true }].concat(palabras, especiales);
  document.getElementById('instr').textContent = 'Regla: casan por color o por ' + S.reglaTexto().toLowerCase() + '. ' + palabras.length + ' cartas de palabra y ' + especiales.length + ' especiales, en ' + Math.ceil(todas.length / 9) + ' hojas. Imprime en color, recorta por la línea de puntos y, si puedes, plastifica. Con la casilla de abajo puedes poner la pista del sonido en cada carta.';
  var ins = document.getElementById('instr'), lab = document.createElement('label'), chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = O.pista;
  lab.style.display = 'block'; lab.style.marginTop = '8px'; lab.appendChild(chk); lab.appendChild(document.createTextNode(' Poner la pista del sonido en cada carta')); ins.parentNode.insertBefore(lab, ins.nextSibling);
  document.getElementById('volver').href = './' + location.search;
  function pinta() {
    var h = document.getElementById('hojas'); h.innerHTML = ''; var hoja = null;
    todas.forEach(function (c, i) {
      if (i % 9 === 0) { hoja = document.createElement('div'); hoja.className = 'hoja'; h.appendChild(hoja); }
      var caja = document.createElement('div'); caja.className = 'c' + (c.reglas ? ' reglas' : ''); var f = document.createElement('div');
      if (c.reglas) {
        f.className = 'cara';
        f.innerHTML = '<b>Suena igual</b><br><br>Se reparten 5 cartas a cada uno. Se pone una boca arriba.<br><br>Por turnos, se echa una carta <b style="font-size:inherit">del mismo color</b> o que <b style="font-size:inherit">suene igual</b>: ' + S.reglaTexto().toLowerCase() + '.<br><br>Al echarla, se dice la palabra en voz alta. Si no puedes, robas una.<br><br>+2: el otro roba dos. ⊘: el otro pierde el turno. ★: eliges color.<br><br>Gana quien se queda sin cartas.';
      } else if (c.tipo === 'palabra') {
        f.className = 'cara ' + c.color;
        f.innerHTML = '';
        var p = document.createElement('span'); p.className = 'p'; p.textContent = c.w; f.appendChild(p);
        if (chk.checked) { var s = document.createElement('span'); s.className = 's'; s.textContent = S.nombreClave(c.son); f.appendChild(s); }
      } else {
        f.className = 'cara ' + (c.color || 'negra');
        var e = document.createElement('span'); e.className = 'e'; e.textContent = c.tipo === 'roba2' ? '+2' : (c.tipo === 'pasa' ? '⊘' : '★'); f.appendChild(e);
        var s2 = document.createElement('span'); s2.className = 's'; s2.textContent = c.tipo === 'roba2' ? 'Roba 2' : (c.tipo === 'pasa' ? 'Pasa turno' : 'Elige color'); f.appendChild(s2);
      }
      var pie = document.createElement('span'); pie.className = 'pie'; pie.textContent = 'Suena igual · Gabinete Fönia y ColmenIA'; f.appendChild(pie);
      caja.appendChild(f); hoja.appendChild(caja);
    });
  }
  chk.onchange = pinta; pinta();
  try { if (localStorage.getItem('suena-no-contar') !== '1') new Image().src = 'https://abacus.jasoncameron.dev/hit/foniafonia-juegos/suena_imprimir_abierta'; } catch (e) { }
})();
</script>
</body>
</html>
